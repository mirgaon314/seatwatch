name: seatwatch

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay scheduled runs when busy
  workflow_dispatch:
    inputs:
      test:
        description: Send a test notification instead of checking
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: seatwatch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      # state.json remembers the last status so an open seat is not re-sent every run
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: python3 -I watch.py ${{ inputs.test && '--test-notify' || '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
